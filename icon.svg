<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="70%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />
  <!-- 8-Pointed Rub El Hizb Star -->
  <g transform="translate(256, 256)" stroke="url(#goldGrad)" stroke-width="6" fill="#064e3b" fill-opacity="0.6">
    <rect x="-120" y="-120" width="240" height="240" rx="12" />
    <rect x="-120" y="-120" width="240" height="240" rx="12" transform="rotate(45)" />
  </g>
  <!-- Central Crescent & Star -->
  <path d="M 280 180 A 75 75 0 1 0 280 332 A 90 90 0 1 1 280 180 Z" fill="url(#goldGrad)" />
  <polygon points="295,225 303,245 324,245 307,258 313,278 295,266 277,278 283,258 266,245 287,245" fill="url(#goldGrad)" />
</svg>
